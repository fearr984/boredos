  renderGamesTab();
}

function getFilteredGames() {
  let games = OS.games;
  if (gamesCurrentSource !== 'All') games = games.filter(g => g.source === gamesCurrentSource);
  if (gamesCurrentSearch) {
    const q = gamesCurrentSearch.toLowerCase();
    games = games.filter(g => g.title.toLowerCase().includes(q));
  }
  return games;
}

function renderGamesTab() {
  const body = document.getElementById('games-body');
  if (!body) return;

  if (!OS.gamesLoaded) {
    if (!OS.gamesLoading) loadAllGames();
    body.innerHTML = `<div style="padding:20px">
      <div class="games-section-title">Loading games...</div>
      <div class="games-grid">
        ${Array(8).fill('<div class="skeleton" style="aspect-ratio:4/3"></div>').join('')}
      </div>
    </div>`;
    setTimeout(renderGamesTab, 1000);
    return;
  }

  if (gamesCurrentTab === 'discover') renderGamesDiscover(body);
  else if (gamesCurrentTab === 'library') renderGamesLibrary(body);
  else if (gamesCurrentTab === 'favorites') renderGamesFavorites(body);
  else if (gamesCurrentTab === 'recent') renderGamesRecent(body);

  hydrateVisibleLuminCovers();
}

function loadLuminScript(callback) {
  if (typeof Lumin !== 'undefined' && Lumin.init) {
    if (callback) callback();
    return;
  }
  const existing = document.getElementById('lumin-sdk-script');
  if (existing) {
    existing.addEventListener('load', () => { if (callback) callback(); });
    return;
  }
  const script = document.createElement('script');
  script.id = 'lumin-sdk-script';
  script.src = 'https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js';
  script.async = true;
  script.onload = () => {
    if (callback) callback();
  };
  script.onerror = () => {
    console.warn('Lumin script failed to load from CDN');
    const container = document.getElementById('games');
    if (container) container.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-tertiary);font-size:12px">Lumin SDK offline. All bored os built-in games remain available below!</div>';
  };
  document.body.appendChild(script);
}

function initLuminContainer() {
  const container = document.getElementById('games');
  if (!container) return;
  container.innerHTML = '<div style="padding:30px;text-align:center;color:var(--text-tertiary);font-size:12px">Connecting to Lumin SDK...</div>';
  loadLuminScript(() => {
    try {
      if (typeof Lumin !== 'undefined' && Lumin.init) {
        container.innerHTML = '';
        Lumin.init({
          container: '#games',
          theme: 'dark'
        });
      }
    } catch (e) {
      console.error(e);
    }
  });
}

// Resolve Lumin SDK (headless) once and cache game cover blob URLs
const luminCoverCache = {};
let luminInitPromise = null;

function ensureLuminReady() {
  if (!luminInitPromise) {
    luminInitPromise = new Promise((resolve, reject) => {
      const timeout = setTimeout(() => reject(new Error('Lumin SDK init timed out')), 12000);
      const init = async () => {
        try {
          if (!window.__luminInited) {
            await window.Lumin.init({ headless: true });
            window.__luminInited = true;
          }
          clearTimeout(timeout);
          resolve(window.Lumin);
        } catch (e) {
          clearTimeout(timeout);
          reject(e);
        }
      };
      if (window.Lumin && typeof window.Lumin.init === 'function') {
        init();
      } else {
        loadLuminScript(() => {
          if (window.Lumin && typeof window.Lumin.init === 'function') init();
          else { clearTimeout(timeout); reject(new Error('Lumin SDK unavailable')); }
        });
      }
    });
  }
  return luminInitPromise;
}

// LuminSDK aggregates several upstream game sites. Show each upstream as its
// own source instead of flattening everything into a single "Lumin" bucket.
function getLuminSource(id) {
  const prefix = String(id || '').split('/')[0].toLowerCase();
  if (prefix === 'selenite') return 'Selenite';
  if (prefix === 'truffled') return 'Truffled';
  if (prefix === 'quasar') return 'Quasar';
  if (prefix === 'builtin') return 'Builtin';
  return 'Lumin';
}

async function loadLuminCatalog() {
  try {
    await ensureLuminReady();
    if (!window.Lumin || typeof window.Lumin.getGames !== 'function') return;
    const seenIds = new Set(OS.games.filter(g => g.luminId).map(g => g.luminId));
    let page = 1, pages = 1;
    do {
      const res = await window.Lumin.getGames({ page, limit: 100 });
      const list = (res && res.games) || [];
      pages = (res && res.pages) || pages;
      list.forEach(g => {
        if (!g || !g.id || !g.name || seenIds.has(g.id)) return;
        seenIds.add(g.id);
        OS.games.push({
          title: g.name,
          cover: 'https://s3.envato.com/files/fed15e2f-5abf-4758-a1a2-3e3d68013f0d/inline_image_preview.jpg',
          url: '',
          source: getLuminSource(g.id),
          luminId: g.id,
          imageToken: g.image_token || '',
          lumin: true
        });
      });
      page++;
    } while (page <= pages && page <= 60);

    // Refresh the games view if it is open
    if (document.getElementById('games-body')) renderGamesTab();
  } catch (e) {
    console.warn('Lumin SDK catalog skipped:', e);
  }
}

async function hydrateVisibleLuminCovers() {
  if (!window.Lumin || typeof window.Lumin.getImageUrl !== 'function') return;
  const imgs = [...document.querySelectorAll('#games-body img[data-lumin-id]')];
  const pending = imgs.filter(img => !img.dataset.coverResolved);
  await Promise.all(pending.map(async img => {
    const id = img.dataset.luminId;
    if (luminCoverCache[id]) { img.src = luminCoverCache[id]; img.dataset.coverResolved = '1'; return; }
    try {
      const url = await window.Lumin.getImageUrl(img.dataset.imageToken);
      if (url && typeof url === 'string') {
        luminCoverCache[id] = url;
        img.src = url;
        img.dataset.coverResolved = '1';
      }
    } catch (e) { /* keep fallback */ }
  }));

  // Featured banner cover
  const feat = document.querySelector('#games-body .featured-game[data-feat-lumin-id]');
  if (feat && !feat.dataset.coverResolved) {
    const id = feat.dataset.featLuminId;
    try {
      let url = luminCoverCache[id];
      if (!url) {
        url = await window.Lumin.getImageUrl(feat.dataset.featImageToken);
        if (url && typeof url === 'string') luminCoverCache[id] = url;
      }
      const bg = feat.querySelector('.featured-game-bg');
      if (url && bg) { bg.style.backgroundImage = `url('${url}')`; feat.dataset.coverResolved = '1'; }
    } catch (e) { /* keep fallback */ }
  }
}

function renderGamesDiscover(body) {
  const filtered = getFilteredGames();
  const isSearching = gamesCurrentSearch || gamesCurrentSource !== 'All';

  let html = '';

  // Lumin games are merged into the main grid below (no separate grid)

  // Featured game (only when not searching)
  if (!isSearching && filtered.length > 0) {
    const feat = filtered[Math.floor(Math.random() * Math.min(50, filtered.length))];
    const featCover = (feat.lumin && luminCoverCache[feat.luminId]) ? luminCoverCache[feat.luminId] : feat.cover;
    const featAttrs = feat.lumin ? ` data-feat-lumin-id="${escHtml(feat.luminId)}" data-feat-image-token="${escHtml(feat.imageToken || '')}"` : '';
    html += `<div class="featured-game"${featAttrs} onclick="playGame(${OS.games.indexOf(feat)})">
      <div class="featured-game-bg" style="background-image:url('${featCover}')"></div>
      <div class="featured-game-content">
        <div class="featured-game-badge"><i data-lucide="star" style="width:10px;height:10px"></i> Featured</div>
        <div class="featured-game-title">${escHtml(feat.title)}</div>
        <div class="featured-game-desc">Click to play • Source: ${feat.source}</div>
      </div>
    </div>`;
  }

  // All games grid with pagination
  const totalPages = Math.ceil(filtered.length / GAMES_PER_PAGE);
  const start = (gamesCurrentPage - 1) * GAMES_PER_PAGE;
  const pageGames = filtered.slice(start, start + GAMES_PER_PAGE);

  html += `<div class="games-section">
    <div class="games-section-title">${isSearching ? `Results (${filtered.length})` : `All Games (${filtered.length})`}</div>`;

  if (pageGames.length === 0) {
    html += `<div class="empty-state"><i data-lucide="gamepad-2" style="width:32px;height:32px"></i><div class="empty-state-title">No games found</div><div class="empty-state-desc">Try a different search or filter</div></div>`;
  } else {
    html += `<div class="games-grid">`;
    pageGames.forEach(game => {
      const idx = OS.games.indexOf(game);
      const isFav = OS.favoriteGames.includes(game.title);
      html += renderGameCard(game, idx, isFav);
    });
    html += `</div>`;
  }

  // Pagination
  if (totalPages > 1) {
    html += `<div class="pagination">`;
    if (gamesCurrentPage > 1) html += `<button class="page-btn" onclick="gamesGoPage(${gamesCurrentPage - 1})">← Prev</button>`;
    const startP = Math.max(1, gamesCurrentPage - 2);
    const endP = Math.min(totalPages, startP + 4);
    for (let i = startP; i <= endP; i++) {
      html += `<button class="page-btn ${i === gamesCurrentPage ? 'active' : ''}" onclick="gamesGoPage(${i})">${i}</button>`;
    }
    if (gamesCurrentPage < totalPages) html += `<button class="page-btn" onclick="gamesGoPage(${gamesCurrentPage + 1})">Next →</button>`;
    html += `</div>`;
  }

  html += `</div>`;
  body.innerHTML = html;
  lucide.createIcons();
}

function renderGamesLibrary(body) {
  const filtered = getFilteredGames();
  const totalPages = Math.ceil(filtered.length / GAMES_PER_PAGE);
  const start = (gamesCurrentPage - 1) * GAMES_PER_PAGE;
  const pageGames = filtered.slice(start, start + GAMES_PER_PAGE);

  let html = `<div class="games-section">
    <div class="games-section-title">All Games (${filtered.length})</div>
    <div class="games-grid">`;
  pageGames.forEach(game => {
    const idx = OS.games.indexOf(game);
    const isFav = OS.favoriteGames.includes(game.title);
    html += renderGameCard(game, idx, isFav);
  });
  html += `</div>`;

  if (totalPages > 1) {
    html += `<div class="pagination">`;
    if (gamesCurrentPage > 1) html += `<button class="page-btn" onclick="gamesGoPage(${gamesCurrentPage - 1})">← Prev</button>`;
    const startP = Math.max(1, gamesCurrentPage - 2);
    const endP = Math.min(totalPages, startP + 4);
    for (let i = startP; i <= endP; i++) {
      html += `<button class="page-btn ${i === gamesCurrentPage ? 'active' : ''}" onclick="gamesGoPage(${i})">${i}</button>`;
    }
    if (gamesCurrentPage < totalPages) html += `<button class="page-btn" onclick="gamesGoPage(${gamesCurrentPage + 1})">Next →</button>`;
    html += `</div>`;
  }

  html += `</div>`;
  body.innerHTML = html;
  lucide.createIcons();
}

function renderGamesFavorites(body) {
  const favGames = OS.games.filter(g => OS.favoriteGames.includes(g.title));
  if (favGames.length === 0) {
    body.innerHTML = `<div class="empty-state" style="height:100%"><i data-lucide="heart" style="width:32px;height:32px"></i><div class="empty-state-title">No favorites yet</div><div class="empty-state-desc">Click the heart icon on any game to add it to favorites</div></div>`;

async function playGame(idx) {
  const game = OS.games[idx];
  if (!game) return;

  // Add to recent
  OS.recentGames = [{ title: game.title, cover: game.cover }, ...OS.recentGames.filter(g => g.title !== game.title)].slice(0, 20);
  localStorage.setItem('bored-os-recent-games', JSON.stringify(OS.recentGames));

  const content = `<div class="game-player" id="game-player-${OS.nextWindowId}">
    <div class="game-player-loading" id="game-loading-${OS.nextWindowId}">
      <div class="game-player-spinner"></div>
      <div style="font-size:14px;font-weight:600">Loading ${escHtml(game.title)}...</div>
      <div style="font-size:12px;color:var(--text-tertiary);margin-top:4px">${game.source}</div>
    </div>
    <div class="game-player-toolbar">
      <button class="game-player-btn danger" onclick="closeWindow(this.closest('.app-window').id.replace('win-',''))" title="Back">
        <i data-lucide="arrow-left" style="width:12px;height:12px"></i> Back
      </button>
      <button class="game-player-btn" onclick="reloadGame(this)" title="Reload">
        <i data-lucide="refresh-cw" style="width:12px;height:12px"></i>
      </button>
      <button class="game-player-btn" onclick="fullscreenGame(this)" title="Fullscreen">
        <i data-lucide="maximize" style="width:12px;height:12px"></i>
      </button>
      <button class="game-player-btn" onclick="openGameNewTab('${escHtml(game.url)}')" title="Open in new tab">
        <i data-lucide="external-link" style="width:12px;height:12px"></i>
      </button>
    </div>
    <iframe sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms allow-popups allow-modals"
            allow="autoplay; fullscreen; pointer-lock; gamepad"
            allowfullscreen style="opacity:0;transition:opacity 0.3s"
            onload="this.style.opacity='1';var ld=this.closest('.game-player').querySelector('.game-player-loading');if(ld)ld.style.display='none'"
            onerror="showGameError(this)"></iframe>
  </div>`;

  const win = createWindow('game-play-' + idx, game.title, 850, 550, content, { icon: 'gamepad-2', allowMultiple: true });
  const iframe = document.querySelector(`#win-body-${win.id} iframe`);

  try {
    // Lumin SDK games use a single-use playable URL from getGameUrl()
    if (game.lumin) {
      await ensureLuminReady();
      const res = await window.Lumin.getGameUrl(game.luminId);
      const url = res && (res.url || res);
      if (!url) throw new Error('No playable URL');
      if (iframe) iframe.src = url;
      return;
    }

    // Try fetching and injecting via srcdoc (like Lumi does)
    const resp = await fetch(game.url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    let html = await resp.text();

    // Replace template variables
    const UGS_HTML_URL1 = "https://cdn.jsdelivr.net/gh/Sea-Math/ugs-1@main";
    const UGS_HTML_URL2 = "https://cdn.jsdelivr.net/gh/Sea-Math/ugs-2@main";
    const UGS_HTML_URL3 = "https://cdn.jsdelivr.net/gh/Sea-Math/ugs-3@main";
    const GNMATH_HTML = "https://cdn.jsdelivr.net/gh/freebuisness/html@main";
    const DAKNUX_HTML = "https://cdn.jsdelivr.net/gh/daknux/html@main";
    const defaultHtml = game.source === 'GNMath' ? GNMATH_HTML : game.source === 'Daknux' ? DAKNUX_HTML : UGS_HTML_URL1;
    const defaultCover = game.source === 'GNMath' ? "https://cdn.jsdelivr.net/gh/freebuisness/covers@main" : game.source === 'Daknux' ? "https://cdn.jsdelivr.net/gh/daknux/covers@main" : UGS_HTML_URL1.replace('/ugs-1@main', '/ugs-covers@main');

    html = html.replace(/{HTML_URL1}/gi, UGS_HTML_URL1).replace(/%7BHTML_URL1%7D/gi, UGS_HTML_URL1)
               .replace(/{HTML_URL2}/gi, UGS_HTML_URL2).replace(/%7BHTML_URL2%7D/gi, UGS_HTML_URL2)
               .replace(/{HTML_URL3}/gi, UGS_HTML_URL3).replace(/%7BHTML_URL3%7D/gi, UGS_HTML_URL3)
               .replace(/{HTML_URL}/gi, defaultHtml).replace(/%7BHTML_URL%7D/gi, defaultHtml)
               .replace(/{COVER_URL}/gi, defaultCover).replace(/%7BCOVER_URL%7D/gi, defaultCover);

    html = html.replace(/(src|href|action|data)=(['"])\/([^/])/gi, '$1=$2$3');

    const baseUrl = game.url.substring(0, game.url.lastIndexOf('/') + 1);
    if (!/\<base\b[^>]*>/i.test(html)) {
      const baseTag = `<base href="${baseUrl}">`;
      if (html.match(/<head[^>]*>/i)) {
        html = html.replace(/(<head[^>]*>)/i, `$1\n${baseTag}`);
      } else {
        html = baseTag + '\n' + html;
      }
    }

    if (iframe) iframe.srcdoc = html;
  } catch (e) {
    // Fallback: direct URL
    if (iframe) {
      iframe.src = game.url;
    }
  }
}

function reloadGame(btn) {
  const iframe = btn.closest('.game-player').querySelector('iframe');
  if (iframe) {
    if (iframe.srcdoc) { const s = iframe.srcdoc; iframe.srcdoc = ''; setTimeout(() => iframe.srcdoc = s, 50); }
    else if (iframe.src) { iframe.src = iframe.src; }
  }
}

      <button class="calc-btn" onclick="calcInput('6')">6</button>
      <button class="calc-btn op" onclick="calcInput('-')">−</button>
      <button class="calc-btn" onclick="calcInput('1')">1</button>
      <button class="calc-btn" onclick="calcInput('2')">2</button>
      <button class="calc-btn" onclick="calcInput('3')">3</button>
      <button class="calc-btn op" onclick="calcInput('+')">+</button>
      <button class="calc-btn" onclick="calcInput('0')" style="grid-column:span 2">0</button>
      <button class="calc-btn" onclick="calcInput('.')">.</button>
      <button class="calc-btn accent" onclick="calcInput('=')">=</button>

let calcCurrent = '0', calcPrev = '', calcOp = '', calcNewNum = true;
function calcInput(val) {
  const result = document.getElementById('calc-result');
  const expr = document.getElementById('calc-expr');
  if (!result) return;

  if (val === 'C') { calcCurrent = '0'; calcPrev = ''; calcOp = ''; calcNewNum = true; result.textContent = '0'; expr.textContent = ''; return; }
  if (val === '±') { calcCurrent = String(-parseFloat(calcCurrent)); result.textContent = calcCurrent; return; }
  if (val === '%') { calcCurrent = String(parseFloat(calcCurrent) / 100); result.textContent = calcCurrent; return; }

  if (['+','-','×','÷'].includes(val)) {
    if (calcOp && !calcNewNum) {
      calcPrev = String(calcEval(parseFloat(calcPrev), parseFloat(calcCurrent), calcOp));
      result.textContent = calcPrev;
    } else {
      calcPrev = calcCurrent;
    }
    calcOp = val;
    calcNewNum = true;
    expr.textContent = `${calcPrev} ${val}`;
    return;
  }

  if (val === '=') {
    if (calcOp && calcPrev) {
      const res = calcEval(parseFloat(calcPrev), parseFloat(calcCurrent), calcOp);
      expr.textContent = `${calcPrev} ${calcOp} ${calcCurrent} =`;
      calcCurrent = String(res);
      result.textContent = calcCurrent;
      calcPrev = ''; calcOp = ''; calcNewNum = true;
    }
    return;
  }

  // Number / decimal
  if (calcNewNum) { calcCurrent = val === '.' ? '0.' : val; calcNewNum = false; }
  else { if (val === '.' && calcCurrent.includes('.')) return; calcCurrent += val; }
  result.textContent = calcCurrent;
}

function calcEval(a, b, op) {
  switch (op) {
    case '+': return a + b;
    case '-': return a - b;
    case '×': return a * b;
    case '÷': return b !== 0 ? a / b : 'Error';
  }
  return b;
}

let fileCurrentPath = ['root'];

function openFiles() {
  fileCurrentPath = ['root'];
  const content = `<div style="display:flex;flex-direction:column;height:100%">
    <div class="file-toolbar">
      <button class="file-toolbar-btn" onclick="fileNavigateUp()"><i data-lucide="arrow-left" style="width:12px;height:12px"></i></button>
      <div class="file-breadcrumb" id="file-breadcrumb"></div>
      <button class="file-toolbar-btn" onclick="fileCreateFolder()"><i data-lucide="folder-plus" style="width:12px;height:12px"></i> New Folder</button>
      <button class="file-toolbar-btn" onclick="fileCreateFile()"><i data-lucide="file-plus" style="width:12px;height:12px"></i> New File</button>
    </div>
    <div class="file-list" id="file-list" style="flex:1;overflow-y:auto"></div>
  </div>`;
  createWindow('files', 'Files', 560, 420, content, { icon: 'folder' });
  renderFiles();
}

function getCurrentFolder() {
  let node = OS.files;
  for (let i = 1; i < fileCurrentPath.length; i++) {
    const child = node.children.find(c => c.name === fileCurrentPath[i]);
    if (!child || child.type !== 'folder') return node;
    node = child;
  }
  return node;
}

function renderFiles() {
  const folder = getCurrentFolder();
  const list = document.getElementById('file-list');
  const bc = document.getElementById('file-breadcrumb');
  if (!list || !bc) return;

  bc.innerHTML = fileCurrentPath.map((p, i) => {
    const label = i === 0 ? '~' : p;
    return `<span onclick="fileNavigateTo(${i})">${label}</span>${i < fileCurrentPath.length - 1 ? ' <span style="color:var(--text-tertiary)">/</span> ' : ''}`;
  }).join('');

  if (!folder.children || folder.children.length === 0) {
    list.innerHTML = `<div class="empty-state" style="padding:40px"><i data-lucide="folder-open" style="width:32px;height:32px"></i><div class="empty-state-title">Empty folder</div><div class="empty-state-desc">Create files or folders to get started</div></div>`;
    lucide.createIcons();
    return;
  }

  const sorted = [...folder.children].sort((a, b) => {
    if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
    return a.name.localeCompare(b.name);
  });

  list.innerHTML = sorted.map(item => `
    <div class="file-item" ondblclick="fileOpen('${escHtml(item.name)}')"
         oncontextmenu="event.preventDefault();fileContextMenu(event,'${escHtml(item.name)}')">
      <i data-lucide="${item.type === 'folder' ? 'folder' : 'file-text'}" class="file-item-icon" style="width:18px;height:18px"></i>
      <span class="file-item-name">${escHtml(item.name)}</span>
      <span class="file-item-meta">${item.type === 'folder' ? `${(item.children || []).length} items` : (item.size || '')}</span>
    </div>
  `).join('');
  lucide.createIcons();
}

function fileOpen(name) {
  const folder = getCurrentFolder();
  const item = folder.children.find(c => c.name === name);
  if (!item) return;
  if (item.type === 'folder') {
    fileCurrentPath.push(name);
    renderFiles();
  } else {
    // Open in text editor
    const content = `<div style="display:flex;flex-direction:column;height:100%">
      <div class="editor-toolbar">
        <button class="editor-toolbar-btn" onclick="saveFileContent(this,'${escHtml(name)}')" title="Save">
          <i data-lucide="save" style="width:14px;height:14px"></i>
        </button>
        <span style="font-size:11px;color:var(--text-tertiary);margin-left:8px">${escHtml(name)}</span>
      </div>
      <textarea class="editor-area" id="file-editor-area">${escHtml(item.content || '')}</textarea>
    </div>`;
    createWindow('file-edit-' + name, name, 500, 400, content, { icon: 'file-text', allowMultiple: true });
    lucide.createIcons();
  }
}

function saveFileContent(btn, name) {
  const textarea = btn.closest('.window-body').querySelector('.editor-area');
  if (!textarea) return;
  const folder = getCurrentFolder();
  const item = folder.children.find(c => c.name === name);
  if (item) {
    item.content = textarea.value;
    item.size = new Blob([textarea.value]).size + ' B';
    item.modified = new Date().toISOString();
    saveFiles();
    notify(`Saved ${name}`);
  }
}

function fileNavigateUp() {
  if (fileCurrentPath.length > 1) {
    fileCurrentPath.pop();
    renderFiles();
  }
}

function fileNavigateTo(idx) {
  fileCurrentPath = fileCurrentPath.slice(0, idx + 1);
  renderFiles();
}

function fileCreateFolder() {
  const name = prompt('Folder name:');
  if (!name) return;
  const folder = getCurrentFolder();
  if (folder.children.some(c => c.name === name)) { notify('A file with that name already exists'); return; }
  folder.children.push({ name, type: 'folder', children: [] });
  saveFiles();
  renderFiles();
}

function fileCreateFile() {
  const name = prompt('File name (e.g. notes.txt):');
  if (!name) return;
  const folder = getCurrentFolder();
  if (folder.children.some(c => c.name === name)) { notify('A file with that name already exists'); return; }
  folder.children.push({ name, type: 'file', content: '', size: '0 B', modified: new Date().toISOString() });
  saveFiles();
  renderFiles();
}

function fileContextMenu(e, name) {
  showContextMenu(e.clientX, e.clientY, [
    { label: 'Open', icon: 'file', action: () => fileOpen(name) },
    { label: 'Rename', icon: 'pencil', action: () => fileRename(name) },
    { type: 'separator' },
    { label: 'Delete', icon: 'trash-2', action: () => fileDelete(name) },
  ]);
}

function fileRename(oldName) {
  const newName = prompt('New name:', oldName);
  if (!newName || newName === oldName) return;
  const folder = getCurrentFolder();
  const item = folder.children.find(c => c.name === oldName);
  if (item) { item.name = newName; saveFiles(); renderFiles(); }
}

function fileDelete(name) {
  const folder = getCurrentFolder();
  const idx = folder.children.findIndex(c => c.name === name);
  if (idx !== -1) { folder.children.splice(idx, 1); saveFiles(); renderFiles(); }
}

function saveFiles() {
  localStorage.setItem('bored-os-files', JSON.stringify(OS.files));
}

function getWispNodes() {

  nodes.push({ name: 'Anura Wisp', url: 'wss://anura.pro/wisp/' });

  const saved = localStorage.getItem('bored-os-wisp');
  if (saved && !nodes.some(n => n.url === saved)) {
    nodes.unshift({ name: 'Custom Wisp', url: saved });
  }
  return nodes;
}

function getSelectedWisp() {
  const nodes = getWispNodes();
  if (proxyGatewayIdx < 0 || proxyGatewayIdx >= nodes.length) proxyGatewayIdx = 0;
  return nodes[proxyGatewayIdx];
}

async function setProxyTransport(wispUrl) {
  if (!proxyConnection || proxyWispUrl === wispUrl) return;
  const { BareMuxConnection } = await import(new URL('baremux/index.mjs?v=6', PROXY_BASE).href);
  if (!(proxyConnection instanceof BareMuxConnection)) {
    proxyConnection = new BareMuxConnection(new URL('baremux/worker.js', PROXY_BASE).href);
  }
  await proxyConnection.setTransport(
    new URL('libcurl/index.mjs?v=6', PROXY_BASE).href,
    [{ wisp: wispUrl }]
  );
  proxyWispUrl = wispUrl;
}

// Use a BoredOS-specific DB name. GitHub Pages projects share one origin, so
// a "$scramjet" database left by another project can be empty or incompatible.
// Creating a complete database before the service worker starts also prevents
// the worker from creating an empty one first.
function ensureScramjetDb() {
  return new Promise(resolve => {
    if (!('indexedDB' in window)) return resolve();
    const stores = ['config', 'cookies', 'redirectTrackers', 'referrerPolicies', 'publicSuffixList'];
    let req;
    try {
      req = indexedDB.open('$boredos-scramjet', 1);
    } catch (e) {
      return resolve();
    }
    req.onupgradeneeded = () => {
      const db = req.result;
      for (const name of stores) {
        if (!db.objectStoreNames.contains(name)) db.createObjectStore(name);
      }
    };
    req.onsuccess = () => {
      req.result.close();
      resolve();
    };
    req.onerror = () => resolve();
    req.onblocked = () => setTimeout(resolve, 1500);
  });
}

async function ensureProxy() {
  if (proxyReadyPromise) return proxyReadyPromise;

  proxyReadyPromise = (async () => {
    if (!window.isSecureContext) {
      throw new Error('The proxy needs HTTPS (or localhost) to register its service worker.');
    }
    if (!('serviceWorker' in navigator)) {
      throw new Error('This browser does not support service workers.');
    }

    const swUrl = new URL('sw.js', PROXY_BASE);
    const scope = new URL('./', PROXY_BASE).pathname;
    const wisp = getSelectedWisp();
    const dbPromise = ensureScramjetDb();
    const bundlePromise = window.$scramjetLoadController
      ? Promise.resolve()
      : import(new URL('scramjet/scramjet.bundle.js?v=6', PROXY_BASE).href);

    // The transport bundle is the largest download. Start it as soon as the
    // small BareMux client is ready instead of waiting for the controller.
    const connectionPromise = import(new URL('baremux/index.mjs?v=6', PROXY_BASE).href)
      .then(baremuxModule => {
        const connection = new baremuxModule.BareMuxConnection(
          new URL('baremux/worker.js', PROXY_BASE).href
        );
        const transportReady = connection.setTransport(
          new URL('libcurl/index.mjs?v=6', PROXY_BASE).href,
          [{ wisp: wisp.url }]
        );
        return { connection, transportReady };
      });
    connectionPromise.catch(() => {});

    await Promise.all([dbPromise, bundlePromise]);
    if (!window.$scramjetLoadController) {
      throw new Error('Scramjet controller failed to load.');
    }

    const { connection, transportReady } = await connectionPromise;
    const { ScramjetController } = window.$scramjetLoadController();
    const controller = new ScramjetController({
      prefix: new URL('service/', PROXY_BASE).pathname,
      files: {
        wasm: new URL('scramjet/scramjet.wasm.wasm?v=6', PROXY_BASE).pathname,
        all: new URL('scramjet/scramjet.all.js?v=6', PROXY_BASE).pathname,
        sync: new URL('scramjet/scramjet.sync.js?v=6', PROXY_BASE).pathname
      }
    });

    // Start the config write while the transport finishes. Register the service
    // worker only after the database is complete so it cannot create an empty
    // one before Scramjet does.
    const controllerReady = controller.init();
    const swReadyPromise = controllerReady
      .then(() => navigator.serviceWorker.register(swUrl.href, { scope, updateViaCache: 'none' }))
      .then(registration => {
        // Ask the browser to check the worker script immediately. This avoids
        // an old worker surviving a deploy and serving a stale proxy config.
        registration.update().catch(() => {});
        if (registration.waiting) registration.waiting.postMessage({ type: 'SKIP_WAITING' });
        const worker = registration.installing || registration.waiting;
        if (!worker || worker.state === 'activated') return navigator.serviceWorker.ready;
        return new Promise(resolve => {
          let settled = false;
          const finish = () => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            worker.removeEventListener('statechange', check);
            resolve();
          };
          const check = () => {
            if (worker.state === 'activated' || worker.state === 'redundant') finish();
          };
          const timer = setTimeout(finish, 5000);
          worker.addEventListener('statechange', check);
          check();
        }).then(() => navigator.serviceWorker.ready);
      });

    await Promise.all([controllerReady, transportReady, swReadyPromise]);

    // navigator.serviceWorker.ready only means a worker is active. On the very
    // first visit the current page may not be controlled yet, and an iframe
    // navigation would bypass the proxy and hit the static host's 404 page.
    if (!navigator.serviceWorker.controller) {
      const registration = await navigator.serviceWorker.ready;
      registration.active?.postMessage({ type: 'CLAIM' });
      await new Promise(resolve => {
        let settled = false;
        const finish = () => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          navigator.serviceWorker.removeEventListener('controllerchange', finish);
          resolve();
        };
        const timer = setTimeout(finish, 5000);
        navigator.serviceWorker.addEventListener('controllerchange', finish);
        if (navigator.serviceWorker.controller) finish();
      });
    }

    // Make sure the active worker has the config for this deployment. A worker
    // can be reused across a SW update, and a stale prefix would make it miss
    // /service/ requests and fall through to the static host.
    if (navigator.serviceWorker.controller) {
      try { await controller.modifyConfig({}); } catch (e) {}
      // postMessage is queued; give the worker one task turn to apply the
      // config before the first proxied iframe navigation starts.
      await new Promise(resolve => setTimeout(resolve, 60));
    }

    proxyController = controller;
    proxyConnection = connection;
    proxyWispUrl = wisp.url;
    return controller;
  })().catch(err => {
    proxyReadyPromise = null;
    throw err;
  });

  return proxyReadyPromise;
}

// Re-post the Scramjet config to the active worker before a navigation. The
// worker can outlive a page reload, and a worker that missed the initial
// loadConfig message would fall through to the static host ("Cannot GET").
async function syncProxyConfig(controller) {
  if (!controller || !navigator.serviceWorker.controller) return;
  try { await controller.modifyConfig({}); } catch (e) {}
  await new Promise(resolve => setTimeout(resolve, 60));
}

async function cycleProxyGateway() {
  const nodes = getWispNodes();
  proxyGatewayIdx = (proxyGatewayIdx + 1) % nodes.length;
  localStorage.setItem('bored-os-wisp-idx', String(proxyGatewayIdx));
  const node = nodes[proxyGatewayIdx];
  notify('Proxy node: ' + node.name);
  updateBrowserNodeUI();

  try {
    if (proxyConnection) {
      await setProxyTransport(node.url);
    }
    const input = document.getElementById('browser-url-input');
    if (input && input.value.trim()) browserGo();
  } catch (e) {
    notify('Node failed: ' + (e.message || 'unknown error'));
  }
}

function flareShortcutHTML(shortcut, isCustom) {
  return `<div class="flare-shortcut" data-id="${escHtml(shortcut.id)}">
    <button type="button" class="flare-shortcut-button" data-url="${escHtml(shortcut.url)}" onclick="flareNavigate(this.dataset.url)" aria-label="${escHtml(shortcut.name)}">
      <span class="flare-shortcut-tile">${flareShortcutIcon(shortcut)}</span>
      <span class="flare-shortcut-label">${escHtml(shortcut.name)}</span>
    </button>
    ${isCustom ? `<button type="button" class="flare-shortcut-edit" data-id="${escHtml(shortcut.id)}" onclick="event.stopPropagation();flareOpenShortcutModal(this.dataset.id)" title="Edit shortcut" aria-label="Edit ${escHtml(shortcut.name)}">${FLARE_EDIT_ICON}</button>` : ''}
  </div>`;
}

function flareRenderShortcuts() {
  const row = document.getElementById('flare-shortcut-row');
  if (!row) return;
  row.innerHTML = FLARE_DEFAULT_SHORTCUTS.map(s => flareShortcutHTML(s, false)).join('') +
    flareCustomShortcuts.map(s => flareShortcutHTML(s, true)).join('') +
    `<div class="flare-shortcut"><button type="button" class="flare-shortcut-button" onclick="flareOpenShortcutModal()" aria-label="Add shortcut"><span class="flare-shortcut-tile flare-shortcut-add">${FLARE_PLUS_ICON}</span><span class="flare-shortcut-label">Add</span></button></div>`;
}

function flareRenderSearchEngine() {
  const select = document.getElementById('flare-search-engine');
  if (select) select.value = flareSearchEngine;
}

function flareChangeSearchEngine(value) {
  if (!FLARE_SEARCH_ENGINES[value]) value = 'google';
  flareSearchEngine = value;
  try { localStorage.setItem('bored-flare-search-engine', value); } catch (e) {}
}

function flareLooksLikeUrl(value) {
  if (!value || /\s/.test(value)) return false;
  if (/^https?:\/\//i.test(value)) return true;
  if (/^localhost(:\d+)?(\/.*)?$/i.test(value)) return true;
  return /^[\w-]+(\.[\w-]+)+(:\d+)?(\/.*)?$/i.test(value);
}

function flareNavigate(url) {
  const input = document.getElementById('browser-url-input');
  if (!input) return;
  input.value = url;
  browserGo();
}

function flareSearchGo(event) {
  if (event) event.preventDefault();
  const input = document.getElementById('flare-search-input');
  if (!input) return;
  const value = input.value.trim();
  if (!value) return;
  if (flareLooksLikeUrl(value)) {
    flareNavigate(value);
  } else {
    const engine = FLARE_SEARCH_ENGINES[flareSearchEngine] || FLARE_SEARCH_ENGINES.google;
    flareNavigate(engine.url + encodeURIComponent(value));
  }
}

function setBrowserHomeMode(isHome) {
  const home = document.getElementById('browser-home-view');
  const app = home ? home.closest('.browser-app') : null;
  if (app) app.classList.toggle('home-mode', !!isHome);
}

function flareOpenShortcutModal(id) {
  const modal = document.getElementById('flare-shortcut-modal');
  const title = document.getElementById('flare-modal-title');
  const name = document.getElementById('flare-shortcut-name');
  const url = document.getElementById('flare-shortcut-url');
  const icon = document.getElementById('flare-shortcut-icon');
  const del = document.getElementById('flare-shortcut-delete');
  if (!modal || !title || !name || !url || !icon) return;
  flareEditingShortcutId = id || null;
  const shortcut = id ? flareCustomShortcuts.find(s => s.id === id) : null;
  if (id && !shortcut) return;
  title.textContent = shortcut ? 'Edit shortcut' : 'Add shortcut';
  name.value = shortcut ? shortcut.name : '';
  url.value = shortcut ? shortcut.url : '';
  icon.value = shortcut && shortcut.icon ? shortcut.icon : '';
  if (del) del.style.display = shortcut ? 'inline-flex' : 'none';
  modal.classList.add('open');
  setTimeout(() => name.focus(), 30);
}

function flareCloseShortcutModal() {
  const modal = document.getElementById('flare-shortcut-modal');
  if (modal) modal.classList.remove('open');
  flareEditingShortcutId = null;
}

function flareSaveShortcut(event) {
  if (event) event.preventDefault();
  const nameInput = document.getElementById('flare-shortcut-name');
  const urlInput = document.getElementById('flare-shortcut-url');
  const iconInput = document.getElementById('flare-shortcut-icon');
  const nameValue = (nameInput ? nameInput.value : '').trim();
  let urlValue = (urlInput ? urlInput.value : '').trim();
  let iconValue = (iconInput ? iconInput.value : '').trim();
  if (!nameValue || !urlValue) return;
  if (!/^https?:\/\//i.test(urlValue)) urlValue = 'https://' + urlValue.replace(/^\/+/, '');
  if (!flareLooksLikeUrl(urlValue)) {
    notify('Enter a valid URL, for example https://example.com');
    return;
  }
  if (iconValue && !/^(https?:\/\/|data:image\/)/i.test(iconValue)) {
    iconValue = 'https://' + iconValue.replace(/^\/+/, '');
  }
  const payload = { name: nameValue.slice(0, 32), url: urlValue, icon: iconValue };
  if (flareEditingShortcutId) {
    const index = flareCustomShortcuts.findIndex(s => s.id === flareEditingShortcutId);
    if (index >= 0) flareCustomShortcuts[index] = { ...flareCustomShortcuts[index], ...payload };
  } else {
    flareCustomShortcuts.push({
      id: 'custom-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6),
      ...payload
    });
  }
  flareSaveShortcuts();
  flareRenderShortcuts();
  flareCloseShortcutModal();
}

function flareDeleteShortcut() {
  if (!flareEditingShortcutId) return;
  if (!confirm('Remove this shortcut?')) return;
  flareCustomShortcuts = flareCustomShortcuts.filter(s => s.id !== flareEditingShortcutId);
  flareSaveShortcuts();
  flareRenderShortcuts();
  flareCloseShortcutModal();
}

function getActiveBrowserTab() {
  return browserTabs.find(t => t.id === activeBrowserTabId) || null;
}

function browserTabTitleForUrl(url) {
  try {
    const host = new URL(url).hostname.replace(/^www\./i, '');
    return host || 'New Tab';
  } catch (e) {
    return url || 'New Tab';
  }
}

function renderBrowserTabs() {
  const strip = document.getElementById('browser-tabs');
  if (!strip) return;
  strip.innerHTML = browserTabs.map(tab => {
    const active = tab.id === activeBrowserTabId;
    const icon = tab.kind === 'home' ? BROWSER_TAB_HOME_ICON : BROWSER_TAB_GLOBE_ICON;
    return `<div class="browser-tab${active ? ' active' : ''}" data-tab-id="${tab.id}" onclick="activateBrowserTab(this.dataset.tabId)" title="${escHtml(tab.title)}">
      <span class="browser-tab-icon">${icon}</span>
      <span class="browser-tab-title">${escHtml(tab.title)}</span>
      <button type="button" class="browser-tab-close" data-tab-id="${tab.id}" onclick="event.stopPropagation();closeBrowserTab(this.dataset.tabId)" aria-label="Close tab">&times;</button>
    </div>`;
  }).join('');
}

function stopNestedBoredosWatch(tab) {
  if (tab && tab.nestedWatch) {
    clearInterval(tab.nestedWatch);
    tab.nestedWatch = null;
  }
}

function nestedBoredosNoticeHtml(targetUrl) {
  const safeTarget = JSON.stringify(targetUrl || '');
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;display:grid;place-items:center;background:#111;color:#eee;font-family:Inter,system-ui,sans-serif;padding:24px}
    .wrap{max-width:430px;text-align:center}.logo{font-family:Caveat,cursive;font-size:44px;color:#fff;line-height:1}
    h1{font-size:18px;margin:18px 0 10px}p{font-size:13px;line-height:1.65;color:#a3a3a3;margin:0 0 20px}
    button{border:0;border-radius:999px;padding:11px 20px;background:#fff;color:#111;font:inherit;font-size:13px;font-weight:650;cursor:pointer}
    button:hover{background:#e5e5e5}
  </style></head><body data-boredos-nested="1"><div class="wrap"><div class="logo">bored.</div>
    <h1>This URL is serving BoredOS itself.</h1>
    <p>Opening it inside the BoredOS browser would create an infinite BoredOS-in-BoredOS loop. Open it in a normal tab instead.</p>
    <button type="button" onclick="window.parent.open(${safeTarget}, '_blank', 'noopener')">Open in new tab</button>
  </div></body></html>`;
}

function showNestedBoredosNotice(tab) {
  if (!tab || !tab.iframe) return;
  stopNestedBoredosWatch(tab);
  tab.error = 'This URL is serving BoredOS itself.';
  tab.title = 'BoredOS (nested)';
  tab.failoverAttempts = 0;
  renderBrowserTabs();
  if (tab.id === activeBrowserTabId) {
    setBrowserStatus('This URL is serving BoredOS itself. Open it in a normal tab instead.', false, true, false);
  }
  try {
    tab.iframe.srcdoc = nestedBoredosNoticeHtml(tab.url);
  } catch (e) {
    try { tab.iframe.src = 'about:blank'; } catch (e2) {}
  }
}

function watchForNestedBoredos(tab) {
  if (!tab || !tab.iframe) return;
  stopNestedBoredosWatch(tab);
  const iframe = tab.iframe;
  const started = Date.now();
  tab.nestedWatch = setInterval(() => {
    if (!tab.iframe || tab.iframe !== iframe || !iframe.isConnected) {
      stopNestedBoredosWatch(tab);
      return;
    }
    let doc = null;
    try { doc = iframe.contentDocument; } catch (e) {}
    if (doc) {
      try {
        const isBoredosApp = (doc.querySelector && doc.querySelector('meta[name="boredos-app"]')) ||
          (doc.title && doc.title.trim().toLowerCase() === 'bored os');
        if (isBoredosApp) {
          showNestedBoredosNotice(tab);
          return;
        }
      } catch (e) {}
    }
    if (Date.now() - started > 20000) stopNestedBoredosWatch(tab);
  }, 25);
}

function createBrowserTabIframe(tab) {
  const panels = document.getElementById('browser-tab-panels');
  if (!panels || tab.iframe) return tab.iframe;
  const iframe = document.createElement('iframe');
  iframe.className = 'browser-tab-iframe';
  iframe.src = 'about:blank';
  iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups allow-modals allow-downloads');
  iframe.setAttribute('allowfullscreen', '');
  iframe.style.display = 'none';
  iframe.addEventListener('load', () => {
    try {
      const doc = iframe.contentDocument;
      if (tab.kind !== 'web') return;
      if (doc && doc.querySelector && doc.querySelector('[data-boredos-nested]')) {
        tab.error = 'This URL is serving BoredOS itself.';
        tab.title = 'BoredOS (nested)';
        renderBrowserTabs();
        if (tab.id === activeBrowserTabId) {
          setBrowserStatus('This URL is serving BoredOS itself. Open it in a normal tab instead.', false, true, false);
        }
        return;
      }
      if (isProxyErrorDocument(doc)) {
        const reason = 'The proxy did not load this page.';
        tab.error = reason;
        if (tab.id === activeBrowserTabId) setBrowserStatus(reason + ' Switching nodes...');
        handleProxyFailure(tab, reason);
        return;
      }
      const title = doc && doc.title ? doc.title.trim() : '';
      if (title) {
        tab.error = '';
        tab.failoverAttempts = 0;
        tab.title = title.slice(0, 80);
        renderBrowserTabs();
      }
      if (tab.id === activeBrowserTabId) hideBrowserStatus();
    } catch (e) {
      if (tab.id === activeBrowserTabId) hideBrowserStatus();
    }
  });
  panels.appendChild(iframe);
  tab.iframe = iframe;
  tab.frame = null;
  return iframe;
}

function showBrowserTabPanel(tab) {
  const panels = document.getElementById('browser-tab-panels');
  if (panels) {
    panels.querySelectorAll('iframe').forEach(frameEl => {
      const active = !!tab && frameEl === tab.iframe;
      frameEl.classList.toggle('active', active);
      frameEl.style.display = active ? 'block' : 'none';
    });
  }
  const home = document.getElementById('browser-home-view');
  const frameContainer = document.getElementById('browser-frame-container');
  if (home) home.style.display = 'none';
  if (frameContainer) frameContainer.style.display = 'block';
  setBrowserHomeMode(false);
}

function activateBrowserTab(tabId) {
  const tab = browserTabs.find(t => t.id === tabId);
  if (!tab) return;
  activeBrowserTabId = tab.id;
  browserProxyFrame = tab.frame || null;
  browserProxyTarget = tab.url || '';
  const input = document.getElementById('browser-url-input');
  if (input) input.value = tab.url || '';
  if (tab.kind === 'home') {
    const home = document.getElementById('browser-home-view');
    const frameContainer = document.getElementById('browser-frame-container');
    if (home) home.style.display = 'flex';
    if (frameContainer) frameContainer.style.display = 'none';
    hideBrowserStatus();
    setBrowserHomeMode(true);
    setTimeout(() => {
      const setup = document.getElementById('bored-setup');
      if (setup && setup.classList.contains('open')) return;
      const searchInput = document.getElementById('flare-search-input');
      if (searchInput) searchInput.focus();
    }, 30);
  } else {
    showBrowserTabPanel(tab);
    if (!tab.iframe) setBrowserStatus('Connecting to the proxy...');
    else if (tab.error) setBrowserStatus(tab.error, false, true);
    else hideBrowserStatus();
  }
  renderBrowserTabs();
}

function browserNewTab(makeActive = true) {
  const tab = {
    id: 'btab-' + (++browserTabSeq),
    kind: 'home',
    title: 'New Tab',
    url: '',
    iframe: null,
    frame: null,
    error: ''
  };
  browserTabs.push(tab);
  if (makeActive) activateBrowserTab(tab.id);
  else renderBrowserTabs();
  return tab;
}

function closeBrowserTab(tabId) {
  const index = browserTabs.findIndex(t => t.id === tabId);
  if (index === -1) return;
  const tab = browserTabs[index];
  stopNestedBoredosWatch(tab);
  if (tab.iframe) tab.iframe.remove();
  tab.iframe = null;
  tab.frame = null;
  browserTabs.splice(index, 1);
  if (activeBrowserTabId === tabId) {
    const next = browserTabs[index] || browserTabs[index - 1];
    if (next) activateBrowserTab(next.id);
    else browserNewTab(true);
  } else {
    renderBrowserTabs();
  }
}

function browserInitTabsIfNeeded() {
  const strip = document.getElementById('browser-tabs');
  if (!strip) return;
  if (!strip.children.length || !browserTabs.length) {
    browserTabs = [];
    activeBrowserTabId = null;
    browserNewTab(true);
  } else if (!getActiveBrowserTab()) {
    activateBrowserTab(browserTabs[0].id);
  } else {
    renderBrowserTabs();
  }
}

function boredMaybeShowSetup() {
  try {
    if (localStorage.getItem('boredos-setup-v1') === '1') return false;
  } catch (e) {}
  return boredShowSetup();
}

function boredShowSetup() {
  const modal = document.getElementById('bored-setup');
  if (!modal) return false;
  let completed = false;
  try { completed = localStorage.getItem('boredos-setup-v1') === '1'; } catch (e) {}
  const theme = document.getElementById('bored-setup-theme');
  if (theme) theme.value = OS.theme || 'dark';
  const engine = document.getElementById('bored-setup-engine');
  if (engine) engine.value = (typeof flareSearchEngine === 'string') ? flareSearchEngine : 'google';
  const kicker = document.getElementById('bored-setup-kicker');
  if (kicker) kicker.textContent = completed ? 'Development notice' : 'First run setup';
  const title = document.getElementById('bored-setup-title');
  if (title) title.textContent = completed ? 'BoredOS is in development' : 'Welcome to BoredOS';
  const button = document.getElementById('bored-setup-continue');
  if (button) button.textContent = completed ? 'Close' : 'Enter BoredOS';
  modal.classList.add('open');
  setTimeout(() => { if (theme) theme.focus(); }, 50);
  return true;
}

function boredCompleteSetup() {
  const theme = document.getElementById('bored-setup-theme');
  if (theme && theme.value && theme.value !== OS.theme) applyTheme(theme.value);
  const engine = document.getElementById('bored-setup-engine');
  if (engine && engine.value && typeof flareChangeSearchEngine === 'function') {
    flareChangeSearchEngine(engine.value);
  }
  try { localStorage.setItem('boredos-setup-v1', '1'); } catch (e) {}
  const modal = document.getElementById('bored-setup');
  if (modal) modal.classList.remove('open');
  const searchInput = document.getElementById('flare-search-input');
  if (searchInput) searchInput.focus();
}

document.addEventListener('keydown', (event) => {
  if (event.key !== 'Escape') return;
  const setup = document.getElementById('bored-setup');
  if (setup && setup.classList.contains('open')) {
    boredCompleteSetup();
    return;
  }
  const modal = document.getElementById('flare-shortcut-modal');
  if (modal && modal.classList.contains('open')) flareCloseShortcutModal();
});


function setBrowserStatus(message, spinning = true, isError = false, showSwitchHint = true) {
  const status = document.getElementById('browser-proxy-status');
  const text = document.getElementById('browser-proxy-status-text');
  if (!status || !text) return;
  status.style.display = 'flex';
  status.querySelector('.game-player-spinner').style.display = spinning ? 'block' : 'none';
  text.innerHTML = isError
    ? `${escHtml(message)}${showSwitchHint ? '<br><span style="font-size:11px;color:var(--text-tertiary)">Try the Switch Node button, then press Go again.</span>' : ''}`
    : escHtml(message);
  text.style.color = isError ? 'var(--danger)' : 'var(--text-secondary)';
}

function hideBrowserStatus() {
  const status = document.getElementById('browser-proxy-status');
  if (status) status.style.display = 'none';
}

function setupBrowserFrame(controller, tab) {
  if (!tab || !tab.iframe) return null;
  if (tab.frame) return tab.frame;

  tab.frame = controller.createFrame(tab.iframe);
  tab.frame.addEventListener('urlchange', (event) => {
    if (!event.url) return;
    tab.url = String(event.url);
    tab.title = browserTabTitleForUrl(tab.url);
    if (tab.id === activeBrowserTabId) {
      const input = document.getElementById('browser-url-input');
      if (input) input.value = tab.url;
      browserProxyTarget = tab.url;
      browserProxyFrame = tab.frame;
    }
    renderBrowserTabs();
  });
  return tab.frame;
}

async function initBrowserProxy() {
  try {
    await ensureProxy();
  } catch (e) {
    console.warn('Proxy setup failed:', e);
  }
}

function updateBrowserNodeUI() {
  const node = getSelectedWisp();
  const shortName = node.name.replace(/\s+Wisp$/i, '').toUpperCase();
  const label = document.getElementById('browser-node-label');
  const readout = document.getElementById('browser-node-readout');
  if (label) label.textContent = shortName;
  if (readout) readout.textContent = `${shortName} / ${PROXY_ENGINE_LABEL.toUpperCase()}`;
}

function quickNav(url) {
  flareNavigate(url);
}

function browserHome() {
  const tab = getActiveBrowserTab();
  if (!tab) {
    browserNewTab(true);
    return;
  }
  if (tab.iframe) {
    tab.iframe.remove();
    tab.iframe = null;
    tab.frame = null;
  }
  tab.kind = 'home';
  tab.url = '';
  tab.title = 'New Tab';
  browserProxyTarget = '';
  browserProxyFrame = null;
  const inp = document.getElementById('browser-url-input');
  if (inp) inp.value = '';
  const searchInp = document.getElementById('flare-search-input');
  if (searchInp) searchInp.value = '';
  const home = document.getElementById('browser-home-view');
  const frameContainer = document.getElementById('browser-frame-container');
  hideBrowserStatus();
  if (home) home.style.display = 'flex';
  if (frameContainer) frameContainer.style.display = 'none';
  setBrowserHomeMode(true);
  renderBrowserTabs();
  setTimeout(() => {
    const setup = document.getElementById('bored-setup');
    if (setup && setup.classList.contains('open')) return;
    const focused = document.getElementById('flare-search-input');
    if (focused) focused.focus();
  }, 60);
}

function normalizeBrowserTarget(rawUrl) {
  const value = String(rawUrl || '').trim();
  if (!value) return '';
  if (flareLooksLikeUrl(value)) {
    return /^https?:\/\//i.test(value) ? value : 'https://' + value;
  }
  const engine = FLARE_SEARCH_ENGINES[flareSearchEngine] || FLARE_SEARCH_ENGINES.google;
  return engine.url + encodeURIComponent(value);
}

function getProxyUrl(rawUrl) {
  const targetUrl = normalizeBrowserTarget(rawUrl);
  if (proxyController) return proxyController.encodeUrl(targetUrl);
  return new URL('service/', PROXY_BASE).pathname + encodeURIComponent(targetUrl);
}

function browserBack() {
  if (browserProxyFrame) browserProxyFrame.back();
}

function browserForward() {
  if (browserProxyFrame) browserProxyFrame.forward();
}

function reloadBrowser() {
  if (browserProxyFrame && browserProxyTarget) browserProxyFrame.reload();
}

function openBrowserExternal() {
  const inp = document.getElementById('browser-url-input');
  if (inp && inp.value.trim()) {
    window.open(getProxyUrl(inp.value.trim()), '_blank');
    return;
  }
  const tab = getActiveBrowserTab();
  if (tab && tab.iframe && tab.iframe.src && tab.iframe.src !== 'about:blank') {
    window.open(tab.iframe.src, '_blank');
  }
}

function isProxyErrorDocument(doc) {
  if (!doc) return false;
  try {
    if (doc.querySelector && doc.querySelector('[data-boredos-proxy-error]')) return true;
    const title = doc.title || '';
    const text = doc.body ? (doc.body.innerText || '') : '';
    return /Cannot GET \/service\//i.test(text) ||
      /Page not found · GitHub Pages/i.test(title) ||
      (/File not found/i.test(text) && /GitHub Pages/i.test(text));
  } catch (e) {
    return false;
  }
}

async function handleProxyFailure(tab, reason) {
  if (!tab || !browserTabs.includes(tab)) return;
  const nodes = getWispNodes();
  tab.failoverAttempts = tab.failoverAttempts || 0;
  if (tab.failoverAttempts >= Math.max(1, nodes.length - 1)) {
    tab.error = reason || 'The proxy could not load this page.';
    if (tab.id === activeBrowserTabId) {
      setBrowserStatus(tab.error, false, true);
    }
    return;
  }

  tab.failoverAttempts++;
  proxyGatewayIdx = (proxyGatewayIdx + 1) % nodes.length;
  localStorage.setItem('bored-os-wisp-idx', String(proxyGatewayIdx));
  const node = nodes[proxyGatewayIdx];
  if (tab.id === activeBrowserTabId) {
    setBrowserStatus('Proxy node failed. Switching to ' + node.name + '...');
  }
  updateBrowserNodeUI();

  try {
    if (proxyConnection) await setProxyTransport(node.url);
    const controller = await ensureProxy();
    await syncProxyConfig(controller);
    if (!browserTabs.includes(tab)) return;
    if (tab.iframe) {
      tab.iframe.remove();
      tab.iframe = null;
      tab.frame = null;
    }
    if (tab.id !== activeBrowserTabId) activateBrowserTab(tab.id);
    await browserGo(true);
  } catch (e) {
    tab.error = 'Proxy switch failed: ' + (e.message || 'unknown error');
    if (tab.id === activeBrowserTabId) setBrowserStatus(tab.error, false, true);
  }
}

async function browserGo(fromFailover = false) {
  const input = document.getElementById('browser-url-input');
  if (!input) return;

  const query = input.value.trim();
  if (!query) return;

  let tab = getActiveBrowserTab();
  if (!tab) tab = browserNewTab(true);
  if (!fromFailover) tab.failoverAttempts = 0;

  const targetUrl = normalizeBrowserTarget(query);
  tab.kind = 'web';
  tab.url = targetUrl;
  tab.title = browserTabTitleForUrl(targetUrl);
  tab.error = '';
  browserProxyTarget = targetUrl;
  browserProxyFrame = tab.frame || null;
  showBrowserTabPanel(tab);
  renderBrowserTabs();
  setBrowserStatus('Connecting to the proxy...');

  try {
    const controller = await ensureProxy();
    if (!browserTabs.includes(tab)) return;
    if (!navigator.serviceWorker.controller) {
      throw new Error('The proxy worker is still starting. Press Go again in a moment.');
    }
    // Re-post the config before every navigation. A worker can be reused after
    // a reload/update and would otherwise fall through to the static host.
    await syncProxyConfig(controller);
    if (!browserTabs.includes(tab)) return;
    // Create the iframe only after the worker is active and controlling this
    // page. Creating it earlier can race the first proxy request and let the
    // navigation fall through to the static host (the old "Cannot GET" page).
    if (!tab.iframe) createBrowserTabIframe(tab);
    if (!tab.iframe || !document.body.contains(tab.iframe)) return;
    const frame = setupBrowserFrame(controller, tab);
    if (!frame) throw new Error('Browser frame is not available.');
    if (tab.id === activeBrowserTabId) {
      browserProxyFrame = frame;
      browserProxyTarget = targetUrl;
      input.value = targetUrl;
    }
    // A previous nested-app notice uses srcdoc, which takes precedence over
    // src. Clear it before navigating to a real URL again.
    try { tab.iframe.removeAttribute('srcdoc'); } catch (e) {}
    frame.go(targetUrl);
    watchForNestedBoredos(tab);
    // The proxy is ready at this point. Some sites (Discord, for example) keep
    // loading resources for a long time and may never fire the iframe load
    // event, so don't leave the full-screen status overlay covering the page.
    if (tab.id === activeBrowserTabId) hideBrowserStatus();
  } catch (e) {
    console.warn('Browser navigation failed:', e);
    const message = `Could not load ${targetUrl}. ${e.message || 'Proxy unavailable.'}`;
    tab.error = message;
    if (tab.id === activeBrowserTabId) {
      browserProxyTarget = '';
      setBrowserStatus(message, false, true);
    }
  }
}

async function saveWispServer() {
  const input = document.getElementById('wisp-server-input');
  if (!input) return;
  let val = input.value.trim();
  if (!val) return;
  if (!val.startsWith('ws://') && !val.startsWith('wss://')) {
    notify('Wisp URL must start with ws:// or wss://');
    return;
  }
  if (!val.endsWith('/')) val += '/';

  localStorage.setItem('bored-os-wisp', val);
  const nodeIndex = getWispNodes().findIndex(n => n.url === val);
  proxyGatewayIdx = nodeIndex >= 0 ? nodeIndex : 0;
  localStorage.setItem('bored-os-wisp-idx', String(proxyGatewayIdx));
  updateBrowserNodeUI();

  try {
    await setProxyTransport(val);
    notify('Wisp node updated!');
  } catch (e) {
    notify('Could not switch node: ' + (e.message || 'unknown error'));
  }
  renderSettingsProxy(document.getElementById('settings-content'));
}

function setWispEndpoint(url) {
  const input = document.getElementById('wisp-server-input');
  if (input) input.value = url;
  saveWispServer();
}

function ensureSoundboardAudio() {
  const AudioCtor = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtor) return null;
  if (!sbCtx) {
    sbCtx = new AudioCtor();
    sbMaster = sbCtx.createGain();
    sbMaster.gain.value = sbVolume;
    sbMaster.connect(sbCtx.destination);
  }
  if (sbCtx.state === 'suspended') sbCtx.resume().catch(() => {});
  return sbCtx;
}

function sbRegister(source, gainNode) {
  const entry = { source, gain: gainNode };
  sbActive.add(entry);
  source.addEventListener('ended', () => {
    sbActive.delete(entry);
    try { gainNode.disconnect(); } catch (e) {}
  }, { once: true });
  return entry;
}

function sbTone(spec, ctx, dest, t) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const dur = Math.max(0.03, spec.dur || 0.2);
  const peak = Math.max(0.0005, spec.gain == null ? 0.15 : spec.gain);
  const attack = Math.min(Math.max(0.001, spec.attack == null ? 0.008 : spec.attack), dur * 0.45);
  const release = Math.min(Math.max(0.01, spec.release == null ? 0.1 : spec.release), dur * 0.6);

  osc.type = spec.wave || 'sine';
  osc.frequency.setValueAtTime(Math.max(1, spec.freq || 440), t);
  if (spec.slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1, spec.slideTo), t + dur);
  if (spec.detune) osc.detune.value = spec.detune;

  let node = osc;
  if (spec.filter) {
    const filter = ctx.createBiquadFilter();
    filter.type = spec.filter.type || 'lowpass';
    filter.frequency.setValueAtTime(Math.max(20, spec.filter.freq || 1200), t);
    if (spec.filter.to) filter.frequency.exponentialRampToValueAtTime(Math.max(20, spec.filter.to), t + dur);
    filter.Q.value = spec.filter.q == null ? 1 : spec.filter.q;
    node.connect(filter);
    node = filter;
  }

  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(peak, t + attack);
  gain.gain.setValueAtTime(peak, t + Math.max(attack, dur - release));
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  node.connect(gain);

  if (spec.pan && ctx.createStereoPanner) {
    const panner = ctx.createStereoPanner();
    panner.pan.value = Math.max(-1, Math.min(1, spec.pan));
    gain.connect(panner);
    panner.connect(dest);
  } else {
    gain.connect(dest);
  }

  if (spec.vibrato) {
    const lfo = ctx.createOscillator();
    const lfoGain = ctx.createGain();
    lfo.type = 'sine';
    lfo.frequency.value = spec.vibrato.rate || 5;
    lfoGain.gain.value = spec.vibrato.depth || 5;
    lfo.connect(lfoGain);
    lfoGain.connect(osc.frequency);
    lfo.start(t);
    lfo.stop(t + dur + 0.02);
  }

  osc.start(t);
  osc.stop(t + dur + 0.02);
  sbRegister(osc, gain);
}

function sbChord(spec, ctx, dest, t) {
  const freqs = spec.freqs || [261.63, 329.63, 392.0];
  const perNote = Math.max(0.02, (spec.gain == null ? 0.12 : spec.gain) / Math.sqrt(freqs.length));
  freqs.forEach((freq, i) => {
    sbTone({
      ...spec,
      type: 'tone',
      freq,
      gain: perNote,
      detune: (spec.detune || 0) + (i % 2 ? 4 : -4)
    }, ctx, dest, t + (spec.strum ? i * spec.strum : 0));
  });
}

function sbNoise(spec, ctx, dest, t) {
  const dur = Math.max(0.02, spec.dur || 0.2);
  const frames = Math.max(1, Math.ceil(ctx.sampleRate * dur));
  const buffer = ctx.createBuffer(1, frames, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  let last = 0;
  for (let i = 0; i < frames; i++) {
    const white = Math.random() * 2 - 1;
    if (spec.color === 'brown') {
      last = (last + 0.02 * white) / 1.02;
      data[i] = Math.max(-1, Math.min(1, last * 3.5));
    } else if (spec.color === 'pink') {
      last = 0.98 * last + 0.02 * white;
      data[i] = Math.max(-1, Math.min(1, last * 3));
    } else {
      data[i] = white;
    }
  }

  const src = ctx.createBufferSource();
  src.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = spec.filterType || 'bandpass';
  filter.frequency.setValueAtTime(Math.max(20, spec.freq || 1200), t);
  if (spec.to) filter.frequency.exponentialRampToValueAtTime(Math.max(20, spec.to), t + dur);
  filter.Q.value = spec.q == null ? 1 : spec.q;

  const gain = ctx.createGain();
  const peak = Math.max(0.0005, spec.gain == null ? 0.15 : spec.gain);
  const attack = Math.min(Math.max(0.001, spec.attack == null ? 0.005 : spec.attack), dur * 0.45);
  const release = Math.min(Math.max(0.01, spec.release == null ? 0.08 : spec.release), dur * 0.6);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(peak, t + attack);
  gain.gain.setValueAtTime(peak, t + Math.max(attack, dur - release));
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  src.connect(filter);
  filter.connect(gain);
  if (spec.pan && ctx.createStereoPanner) {
    const panner = ctx.createStereoPanner();
    panner.pan.value = Math.max(-1, Math.min(1, spec.pan));
    gain.connect(panner);
    panner.connect(dest);
  } else {
    gain.connect(dest);
  }

  src.start(t);
  src.stop(t + dur + 0.02);
  sbRegister(src, gain);
}

function sbPerc(spec, ctx, dest, t) {
  const g = spec.gain == null ? 0.24 : spec.gain;
  switch (spec.kind) {
    case 'kick':
      sbTone({ wave: 'sine', freq: 150, slideTo: 42, dur: 0.32, gain: g, attack: 0.002, release: 0.08 }, ctx, dest, t);
      break;
    case 'snare':
      sbNoise({ color: 'white', dur: 0.18, filterType: 'bandpass', freq: 1800, q: 0.8, gain: g, attack: 0.002, release: 0.06 }, ctx, dest, t);
      sbTone({ wave: 'triangle', freq: 180, dur: 0.12, gain: g * 0.45, attack: 0.002, release: 0.04 }, ctx, dest, t);
      break;
    case 'hat':
      sbNoise({ color: 'white', dur: 0.06, filterType: 'highpass', freq: 8000, q: 0.7, gain: g * 0.7, attack: 0.001, release: 0.02 }, ctx, dest, t);
      break;
    case 'openhat':
      sbNoise({ color: 'white', dur: 0.28, filterType: 'highpass', freq: 7000, q: 0.7, gain: g * 0.6, attack: 0.002, release: 0.1 }, ctx, dest, t);
      break;
    case 'clap':
      for (let i = 0; i < 4; i++) {
        sbNoise({ color: 'white', dur: 0.06, filterType: 'bandpass', freq: 1200, q: 1.2, gain: g * 0.55, attack: 0.001, release: 0.02 }, ctx, dest, t + i * 0.012);
      }
      break;
    case 'rim':
      sbTone({ wave: 'square', freq: 1800, dur: 0.035, gain: g * 0.8, attack: 0.001, release: 0.01 }, ctx, dest, t);
      break;
    case 'tomlow':
      sbTone({ wave: 'sine', freq: 110, slideTo: 60, dur: 0.28, gain: g * 0.9, attack: 0.002, release: 0.08 }, ctx, dest, t);
      break;
    case 'tomhigh':
      sbTone({ wave: 'sine', freq: 220, slideTo: 120, dur: 0.22, gain: g * 0.8, attack: 0.002, release: 0.06 }, ctx, dest, t);
      break;
    case 'cowbell':
      sbTone({ wave: 'square', freq: 540, dur: 0.12, gain: g * 0.45, attack: 0.001, release: 0.04 }, ctx, dest, t);
      sbTone({ wave: 'square', freq: 800, dur: 0.12, gain: g * 0.45, attack: 0.001, release: 0.04 }, ctx, dest, t);
      break;
    case 'shaker':
      sbNoise({ color: 'white', dur: 0.12, filterType: 'highpass', freq: 6000, q: 0.7, gain: g * 0.5, attack: 0.005, release: 0.04 }, ctx, dest, t);
      break;
    case 'cymbal':
      sbNoise({ color: 'white', dur: 0.6, filterType: 'highpass', freq: 5000, q: 0.6, gain: g * 0.4, attack: 0.005, release: 0.25 }, ctx, dest, t);
      break;
    case 'kickpunch':
      sbTone({ wave: 'sine', freq: 190, slideTo: 38, dur: 0.4, gain: g * 1.1, attack: 0.002, release: 0.1 }, ctx, dest, t);
      break;
    case 'snaresnap':
      sbNoise({ color: 'white', dur: 0.16, filterType: 'bandpass', freq: 2200, q: 0.9, gain: g * 1.1, attack: 0.001, release: 0.05 }, ctx, dest, t);
      sbTone({ wave: 'triangle', freq: 220, dur: 0.1, gain: g * 0.4, attack: 0.001, release: 0.03 }, ctx, dest, t);
      break;
    case 'hattick':
      sbNoise({ color: 'white', dur: 0.035, filterType: 'highpass', freq: 10000, q: 0.7, gain: g * 0.7, attack: 0.001, release: 0.01 }, ctx, dest, t);
      break;
    case 'clapburst':
      for (let i = 0; i < 5; i++) {
        sbNoise({ color: 'white', dur: 0.05, filterType: 'bandpass', freq: 1400, q: 1.3, gain: g * 0.5, attack: 0.001, release: 0.02 }, ctx, dest, t + i * 0.015);
      }
      break;
    case 'tomdrop':
      sbTone({ wave: 'sine', freq: 180, slideTo: 55, dur: 0.45, gain: g * 0.9, attack: 0.002, release: 0.12 }, ctx, dest, t);
      break;
    case 'rimclick':
      sbTone({ wave: 'square', freq: 2400, dur: 0.03, gain: g * 0.9, attack: 0.001, release: 0.008 }, ctx, dest, t);
      break;
    case 'cowbellhit':
      sbTone({ wave: 'square', freq: 540, dur: 0.16, gain: g * 0.5, attack: 0.001, release: 0.05 }, ctx, dest, t);
      sbTone({ wave: 'square', freq: 800, dur: 0.16, gain: g * 0.5, attack: 0.001, release: 0.05 }, ctx, dest, t);
      break;
    case 'shakerroll':
      for (let i = 0; i < 6; i++) {
        sbNoise({ color: 'white', dur: 0.08, filterType: 'highpass', freq: 6500, q: 0.7, gain: g * 0.35, attack: 0.003, release: 0.03 }, ctx, dest, t + i * 0.05);
      }
      break;
    case 'crash':
      sbNoise({ color: 'white', dur: 0.9, filterType: 'highpass', freq: 4000, q: 0.5, gain: g * 0.45, attack: 0.005, release: 0.4 }, ctx, dest, t);
      break;
    default:
      sbTone({ wave: 'sine', freq: 150, slideTo: 50, dur: 0.3, gain: g, attack: 0.002, release: 0.08 }, ctx, dest, t);
  }
}

function sbSeq(spec, ctx, dest, t) {
  const freqs = spec.freqs || [440];
  const step = spec.step || 0.1;
  const dur = spec.dur || 0.08;
  const repeat = spec.repeat || 1;
  const cycle = step * freqs.length + 0.05;
  for (let r = 0; r < repeat; r++) {
    freqs.forEach((freq, i) => {
      sbTone({
        ...spec,
        type: 'tone',
        freq,
        dur,
        gain: spec.gain == null ? 0.1 : spec.gain,
        attack: 0.002,
        release: Math.min(0.05, dur * 0.4)
      }, ctx, dest, t + r * cycle + i * step);
    });
  }
}

function playSoundSpec(spec, ctx, dest, t) {
  switch (spec.type) {
    case 'chord': sbChord(spec, ctx, dest, t); break;
    case 'noise': sbNoise(spec, ctx, dest, t); break;
    case 'perc': sbPerc(spec, ctx, dest, t); break;
    case 'seq': sbSeq(spec, ctx, dest, t); break;
    case 'tone':
    default: sbTone(spec, ctx, dest, t); break;
  }
}

function soundboardPlay(id) {
  const sound = SB_BY_ID[id];
  if (!sound) return;
  const ctx = ensureSoundboardAudio();
  if (!ctx) {
    notify('Audio is not supported in this browser');
    return;
  }
  if (sbActive.size > 40) soundboardStopAll();
  try {
    playSoundSpec(sound, ctx, sbMaster, ctx.currentTime + 0.015);
  } catch (e) {
    console.warn('Soundboard failed to play:', e);
    notify('Could not play that sound');
    return;
  }
  const pad = document.querySelector(`.soundboard-pad[data-id="${id}"]`);
  if (pad) {
    pad.classList.add('playing');
    setTimeout(() => pad.classList.remove('playing'), 180);
  }
  const status = document.getElementById('soundboard-status');
  if (status) status.textContent = 'Playing: ' + sound.name + ' · ' + sound.categoryName;
}

function soundboardStopAll() {
  for (const entry of sbActive) {
    try { entry.source.stop(); } catch (e) {}
    try { entry.source.disconnect(); } catch (e) {}
    try { entry.gain.disconnect(); } catch (e) {}
  }
  sbActive.clear();
  const status = document.getElementById('soundboard-status');
  if (status) status.textContent = 'Stopped. Click a pad to play.';
}

function soundboardSetVolume(value) {
  const volume = parseFloat(value);
  if (!Number.isFinite(volume)) return;
  sbVolume = Math.min(1, Math.max(0, volume));
  if (sbMaster && sbCtx) {
    sbMaster.gain.setTargetAtTime(sbVolume, sbCtx.currentTime, 0.015);
  }
  try { localStorage.setItem('boredos-soundboard-volume', String(sbVolume)); } catch (e) {}
}

function soundboardSetCategory(id) {
  sbCategory = id;
  soundboardRender();
}

function soundboardSearch(value) {
  sbQuery = value || '';
  soundboardRender();
}

function soundboardRender() {
  const cats = document.getElementById('soundboard-categories');
  const grid = document.getElementById('soundboard-grid');
  const empty = document.getElementById('soundboard-empty');
  if (!cats || !grid) return;

  const categories = [{ id: 'all', name: 'All' }, ...SB_CATEGORIES];
  cats.innerHTML = categories.map(cat => {
    const count = cat.id === 'all' ? SB_SOUNDS.length : SB_SOUNDS.filter(sound => sound.category === cat.id).length;
    const active = sbCategory === cat.id ? ' active' : '';
    return `<button type="button" class="soundboard-cat${active}" onclick="soundboardSetCategory('${cat.id}')">${escHtml(cat.name)} <span>${count}</span></button>`;
  }).join('');

  const query = sbQuery.trim().toLowerCase();
  const filtered = SB_SOUNDS.filter(sound => {
    if (sbCategory !== 'all' && sound.category !== sbCategory) return false;
    if (!query) return true;
    return sound.name.toLowerCase().includes(query) || sound.categoryName.toLowerCase().includes(query);
  });

  grid.innerHTML = filtered.map(sound => `
    <button type="button" class="soundboard-pad" data-id="${sound.id}" style="--pad-color:${sound.color}" onclick="soundboardPlay('${sound.id}')" title="${escHtml(sound.name)} — ${escHtml(sound.categoryName)}">
      <span class="soundboard-pad-name">${escHtml(sound.name)}</span>
      <span class="soundboard-pad-cat">${escHtml(sound.categoryName)}</span>
    </button>`).join('');
  if (empty) empty.style.display = filtered.length ? 'none' : 'block';
}

function openSoundboard() {
  const content = `<div class="soundboard-app">
    <div class="soundboard-head">
      <div class="soundboard-heading">
        <div class="soundboard-title">Soundboard</div>
        <div class="soundboard-subtitle">200 synthesized sounds · no downloads</div>
      </div>
      <div class="soundboard-tools">
        <label class="soundboard-search-wrap">
          <i data-lucide="search"></i>
          <input id="soundboard-search" type="search" placeholder="Search 200 sounds..." autocomplete="off" oninput="soundboardSearch(this.value)">
        </label>
        <button type="button" class="soundboard-btn" onclick="soundboardStopAll()">
          <i data-lucide="square"></i> Stop all
        </button>
        <label class="soundboard-vol" title="Volume">
          <i data-lucide="volume-2"></i>
          <input id="soundboard-volume" type="range" min="0" max="1" step="0.01" value="${sbVolume}" oninput="soundboardSetVolume(this.value)">
        </label>
      </div>
    </div>
    <div id="soundboard-categories" class="soundboard-categories"></div>
    <div id="soundboard-grid" class="soundboard-grid"></div>
    <div id="soundboard-empty" class="soundboard-empty" style="display:none">No sounds match that search.</div>
    <div id="soundboard-status" class="soundboard-status">Click a pad to play. Everything is synthesized live in your browser.</div>
  </div>`;
  createWindow('soundboard', 'Soundboard', 860, 640, content, { icon: 'audio-lines' });
  sbQuery = '';
  const search = document.getElementById('soundboard-search');
  if (search) search.value = '';
  const volume = document.getElementById('soundboard-volume');
  if (volume) volume.value = String(sbVolume);
  soundboardRender();
  lucide.createIcons();
}

// ─── Utility ───
function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ─── UV Proxy Service Worker ───
// Scramjet registers its service worker lazily when the Browser app opens.

// ─── Boot ───
document.addEventListener('DOMContentLoaded', boot);
</script>
